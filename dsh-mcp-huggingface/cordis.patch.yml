# 包成 bundle 才能在 GUI 里开关（原因见 dsh-mcp-rea/cordis.patch.yml 顶部说明）。
#
# hf-mcp-server 是纯 HTTP、无需本地依赖，但挂载后固定带 7,979 字符 ≈ 2.5k tokens。
# 找模型 / 数据集 / 论文时才需要，平时关着。
- insert:
    - id: mcp-huggingface
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: hf-mcp-server
        transport: streamable-http
        url: https://huggingface.co/mcp
        failOnStartupError: false
